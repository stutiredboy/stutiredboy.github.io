{% extends "base.html" %}
{% block title %}标签 &middot; {{ SITENAME }}{% endblock %}
{% block content %}
<div class="post-list-wrapper">
    <header class="page-header">
        <h1 class="page-title">全部标签</h1>
    </header>

    <div class="tag-cloud">
        {% for tag, articles in tags|sort %}
        <a href="{{ SITEURL }}/{{ tag.url }}" class="tag-cloud-item">
            <span class="tag-cloud-name">{{ tag }}</span>
            <span class="tag-cloud-count">{{ articles|length }}</span>
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
